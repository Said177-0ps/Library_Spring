<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
    <style>
        <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f8;
        margin: 0;
        padding: 40px;
    }

    h2 {
        text-align: center;
        color: #333;
        margin-bottom: 25px;
    }

    form {
        width: 400px;
        margin: auto;
        background-color: #ffffff;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }

    form div {
        margin-bottom: 15px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #555;
    }

    input[type="text"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
        box-sizing: border-box;
    }

    input[type="text"]:focus {
        outline: none;
        border-color: #1976d2;
        box-shadow: 0 0 4px rgba(25,118,210,0.4);
    }

    button {
        width: 100%;
        padding: 12px;
        background-color: #1976d2;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
    }

    button:hover {
        background-color: #1565c0;
    }

    a {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #1976d2;
        text-decoration: none;
        font-weight: bold;
    }
    </style>
</head>
<body>
   <h2>Add New Book</h2>
<form th:action="@{/books}"
      th:object="${book}"
      method="post">

    <input type="hidden" th:field="*{id}"/>

    <div>
        <label>Title:</label>
        <input type="text" th:field="*{title}" required/>
    </div>
    <div>
        <label>Author:</label>
        <input type="text" th:field="*{author}" required/>
    </div>
    <div>
        <label>Price:</label>
        <input type="text" th:field="*{price}" required/>
    </div>
    <div>
        <label>Amount:</label>
        <input type="text" th:field="*{amount}" required/>
    </div>

    <button type="submit">Save</button>
</form>

<a th:href="@{/books}">Back</a>
</body>
</html>
