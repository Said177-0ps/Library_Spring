<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #120000, #000000);
            min-height: 100vh;
            padding: 40px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Пульсирующий красный фон */
        body::before {
            content: "";
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,0,0,0.35), transparent);
            border-radius: 50%;
            top: -150px;
            left: -150px;
            animation: pulse 4s infinite alternate ease-in-out;
            z-index: 0;
        }

        @keyframes pulse {
            from { transform: scale(1); opacity: 0.4; }
            to { transform: scale(1.3); opacity: 0.8; }
        }

        h2 {
            margin-bottom: 25px;
            font-size: 34px;
            letter-spacing: 3px;
            color: #ff0000;
            text-shadow: 0 0 20px red;
            position: relative;
            z-index: 2;
        }

        form {
            width: 420px;
            padding: 35px;
            border-radius: 18px;
            background: rgba(255, 0, 0, 0.05);
            backdrop-filter: blur(15px);
            box-shadow: 0 0 40px rgba(255,0,0,0.4);
            position: relative;
            z-index: 2;
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        form div {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            letter-spacing: 1px;
            color: #ffffffcc;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 15px red;
            transform: scale(1.03);
        }

        /* Ошибки */
        .error {
            display: block;
            margin-top: 6px;
            font-size: 12px;
            color: #ff4d4d;
            text-shadow: 0 0 6px red;
        }

        .error-field {
            box-shadow: 0 0 12px rgba(255,0,0,0.8);
            border: 1px solid red;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, #ff0000, #8b0000);
            color: white;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(255,0,0,0.6);
        }

        button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 30px rgba(255,0,0,1);
        }

        a {
            margin-top: 20px;
            text-decoration: none;
            color: #ff4d4d;
            font-weight: bold;
            transition: 0.3s;
            position: relative;
            z-index: 2;
        }

        a:hover {
            text-shadow: 0 0 10px red;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
   <h2>Add New Book</h2>
<form th:action="@{/books}"
      th:object="${book}"
      method="post">

    <input type="hidden" th:field="*{id}"/>

    <div>
        <label>Title:</label>
        <input type="text" th:field="*{title}"
               th:classappend="${#fields.hasErrors('title')} ? 'error-field'"/>
        <br>
        <span class="error"
              th:if="${#fields.hasErrors('title')}"
              th:errors="*{title}"></span>
    </div>
    <div>
        <label>Author:</label>
        <select th:field="*{authorId}" >
            <option th:each="author : ${authors}"
                    th:value="${author.id}"
                    th:text="${author.name}">

            </option>
        </select>
        <br>
        <span class="error" th:id="${#fields.hasErrors('authorId')} ? 'error-field'"
              th:errors="*{authorId}"></span>
    </div>
    <div>
        <label>Price:</label>
        <input type="number" step="0.01" th:field="*{price}"
               th:classappend="${#fields.hasErrors('price')} ? 'error-field' : ''"/>
        <br>
        <span class="error"
              th:if="${#fields.hasErrors('price')}"
              th:errors="*{price}"></span>
    </div>
    <div>
        <label>Amount:</label>
        <input type="number" th:field="*{amount}"
               th:classappend="${#fields.hasErrors('amount')} ? 'error-field' : ''"/>
        <br>
        <span class="error"
              th:if="${#fields.hasErrors('amount')}"
              th:errors="*{amount}"></span>
    </div>

    <button type="submit">Save</button>
</form>

<a th:href="@{/books}">Back</a>
</body>
</html>
